name: Build Native Apps

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: Build unsigned iOS IPA
        required: true
        default: true
        type: boolean
      build_android:
        description: Build Android release APK
        required: true
        default: true
        type: boolean
      ios_bundle_identifier:
        description: Bundle ID used before re-signing the unsigned IPA
        required: false
        default: com.aipm.mobile
        type: string
      ios_app_group_identifier:
        description: App Group shared by the app and widget extension
        required: false
        default: group.com.aipm.mobile
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CI: "1"
  EXPO_NO_TELEMETRY: "1"
  EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
  AI_PM_UPDATE_CHANNEL: internal

jobs:
  ios:
    name: Build unsigned IPA
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_ios }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      AI_PM_IOS_DISTRIBUTION: esign
      AI_PM_IOS_BUNDLE_IDENTIFIER: ${{ inputs.ios_bundle_identifier || 'com.aipm.mobile' }}
      AI_PM_IOS_APP_GROUP_IDENTIFIER: ${{ inputs.ios_app_group_identifier || 'group.com.aipm.mobile' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          ref: 5280bd038207e14f8bd76f5417aa2fe641c03228
          path: theos
          submodules: recursive

      - name: Validate build environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_API_BASE_URL:-}" ]; then
            echo "Repository variable EXPO_PUBLIC_API_BASE_URL is required."
            exit 1
          fi
          python3 - <<'PY'
          import re, subprocess, sys
          output = subprocess.check_output(["xcodebuild", "-version"], text=True)
          print(output.strip())
          match = re.search(r"Xcode\s+(\d+)\.(\d+)", output)
          if not match or tuple(map(int, match.groups())) < (26, 4):
              sys.exit("Expo SDK 57 requires Xcode 26.4 or newer")
          PY
          day_prefix="$(date -u +%y%j)"
          run_suffix="$((GITHUB_RUN_NUMBER % 10000))"
          printf -v build_number '%s%04d' "$day_prefix" "$run_suffix"
          echo "AI_PM_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm run verify

      - name: Generate iOS native project
        run: pnpm exec expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build unsigned IPA
        run: bash scripts/build-unsigned-ios.sh

      - name: Install pinned ipapatch
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v2.1.3 \
            https://github.com/asdfzxcvbn/ipapatch.git "$RUNNER_TEMP/ipapatch"
          mkdir -p "$RUNNER_TEMP/bin"
          (
            cd "$RUNNER_TEMP/ipapatch"
            go build -o "$RUNNER_TEMP/bin/ipapatch" .
          )
          chmod 0755 "$RUNNER_TEMP/bin/ipapatch"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bin/ipapatch" --version

      - name: Build Spotify-style sideload compatibility shim
        shell: bash
        env:
          THEOS: ${{ github.workspace }}/theos
        run: |
          set -euo pipefail
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

          SHIM_REPO="$RUNNER_TEMP/eevee-sideload-shim"
          git clone --filter=blob:none --no-checkout \
            https://github.com/SideloadLabs/EeveeSpotifyReincarnated.git "$SHIM_REPO"
          git -C "$SHIM_REPO" sparse-checkout init --cone
          git -C "$SHIM_REPO" sparse-checkout set modules/zxPluginsInject modules/fishhook
          git -C "$SHIM_REPO" checkout 89e07d97a0afb3b3b6a245a440feaf7c3efd16e8

          make -C "$SHIM_REPO/modules/zxPluginsInject" FINALPACKAGE=1
          SHIM_PATH="$SHIM_REPO/modules/zxPluginsInject/.theos/obj/zxPluginsInject.dylib"
          if [ ! -f "$SHIM_PATH" ]; then
            SHIM_PATH="$SHIM_REPO/modules/zxPluginsInject/.theos/obj/debug/zxPluginsInject.dylib"
          fi
          test -f "$SHIM_PATH"
          cp "$SHIM_PATH" "$RUNNER_TEMP/zxPluginsInject.dylib"
          /usr/bin/install_name_tool -id '@rpath/zxPluginsInject.dylib' "$RUNNER_TEMP/zxPluginsInject.dylib"
          /usr/bin/otool -L "$RUNNER_TEMP/zxPluginsInject.dylib"

      - name: Patch sideload widget compatibility
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/patch-ios-sideload.sh \
            AI-PM-unsigned.ipa \
            AI-PM-sideload-patched.ipa \
            "$RUNNER_TEMP/zxPluginsInject.dylib"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-PM-ios-unsigned-${{ github.run_number }}
          path: AI-PM-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload patched sideload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AI-PM-ios-sideload-patched-${{ github.run_number }}
          path: AI-PM-sideload-patched.ipa
          if-no-files-found: error
          retention-days: 14

  android:
    name: Build Android APK
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_android }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate build environment
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_PUBLIC_API_BASE_URL:-}" ]; then
            echo "Repository variable EXPO_PUBLIC_API_BASE_URL is required."
            exit 1
          fi
          day_prefix="$(date -u +%y%j)"
          run_suffix="$((GITHUB_RUN_NUMBER % 10000))"
          printf -v build_number '%s%04d' "$day_prefix" "$run_suffix"
          echo "AI_PM_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify project
        run: pnpm run verify

      - name: Generate Android native project
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: bash scripts/build-android-apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-PM-android-apk-${{ github.run_number }}
          path: AI-PM-android-release.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [ios, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: AI-PM-*
          path: release-assets
          merge-multiple: true

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/AI-PM-sideload-patched.ipa \
            release-assets/AI-PM-unsigned.ipa \
            release-assets/AI-PM-android-release.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "AI-PM $GITHUB_REF_NAME" \
            --generate-notes
